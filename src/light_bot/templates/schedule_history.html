<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule History for {{ group_id }}</title>
    <style>
        body {
            font-family: sans-serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Schedule History for {{ group_id }}</h1>
    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Schedule</th>
            </tr>
        </thead>
        <tbody>
            {% for item in history %}
            <tr>
                <td>{{ item.timestamp }}</td>
                <td><pre>{{ item.schedule_text }}</pre></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
